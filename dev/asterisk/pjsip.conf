; SIP over WebSocket. The HTTP server in http.conf owns the socket.
[transport-ws]
type=transport
protocol=ws
bind=127.0.0.1

; The browser's extension. webrtc=yes is the bundle a PBXware WebRTC
; extension needs too: DTLS-SRTP, ICE, AVPF, rtcp-mux.
[webrtc1]
type=endpoint
context=test
aors=webrtc1
auth=webrtc1
webrtc=yes
dtls_auto_generate_cert=yes
disallow=all
allow=ulaw

[webrtc1]
type=auth
auth_type=userpass
username=webrtc1
password=webrtc1-test-only

[webrtc1]
type=aor
max_contacts=1
remove_existing=yes
