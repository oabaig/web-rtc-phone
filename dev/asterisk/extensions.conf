; Numbers the softphone test dials.
[test]
; Echo: you hear yourself, so audio is verified in both directions.
exten => 600,1,Answer()
 same => n,Echo()

; Rings and never answers, for the cancel test.
exten => 601,1,Ringing()
 same => n,Wait(60)

; Collects four DTMF digits, stores them for the test to read, hangs up
; (which doubles as the far-end hang-up test).
exten => 700,1,Answer()
 same => n,Read(DIGITS,,4,,1,15)
 same => n,Set(DB(test/dtmf)=${DIGITS})
 same => n,Hangup()

; 486 Busy Here.
exten => 486,1,Busy(10)
